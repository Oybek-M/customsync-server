# Bu fayl /etc/nginx/sites-available/ ga qo'yiladi. U http{} konteksti
# ichiga include qilinadi, shuning uchun quyidagi map direktivasi shu
# yerda turishi to'g'ri.
#
# Nima uchun map kerak: Connection: upgrade sarlavhasini HAR BIR so'rovga
# qo'yib yuborish backend bilan keep-alive ulanishini buzadi. map faqat
# haqiqiy WebSocket so'rovlarida upgrade qiladi, qolganida "close" beradi.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name sync.example.uz;

    ssl_certificate     /etc/letsencrypt/live/sync.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # media.max_upload_bytes = 52428800 (50 MiB) bilan MOS bo'lishi shart.
    # Bu yer kichikroq bo'lsa, klient serverning 413 emas, nginx ning 413
    # javobini oladi va xato xabari noto'g'ri bo'ladi.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade -- busiz /ws/notify ishlamaydi.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # /ws/notify ulanishi trafiksiz uzoq turadi. Standart 60s uni
        # jimgina uzib qo'yadi va klient bildirishnomalarni yo'qotadi.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name sync.example.uz;
    return 301 https://$host$request_uri;
}
