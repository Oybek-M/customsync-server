# Bu fayl /etc/nginx/sites-available/ ga qo'yiladi. U http{} konteksti
# ichiga include qilinadi, shuning uchun quyidagi map va log_format
# direktivalari shu yerda turishi to'g'ri.
#
# Nima uchun map kerak: Connection: upgrade sarlavhasini HAR BIR so'rovga
# qo'yib yuborish backend bilan keep-alive ulanishini buzadi. map faqat
# haqiqiy WebSocket so'rovlarida upgrade qiladi, qolganida "close" beradi.
# Nom ataylab noyob: bir nginx'dagi boshqa saytlar ko'pincha
# $connection_upgrade ni o'zi e'lon qiladi, ikkinchi e'lon esa nginx'ni
# ishga tushirmaydi ("duplicate variable").
map $http_upgrade $customsync_connection_upgrade {
    default upgrade;
    ''      close;
}

# tdesktop /ws/notify ga access token'ni URL'da (?access_token=...) yuboradi.
# Standart "combined" format so'rov qatorini query bilan birga yozadi, ya'ni
# token har ulanishda diskdagi logga tushardi. Bu format yo'lni query'siz yozadi.
# (error_log baribir to'liq so'rov qatorini yozadi -- masalan backend
# o'chiq paytdagi 502 da. To'liq yechim -- token'ni sarlavhada yuborish.)
log_format customsync_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    # http2 ataylab yoqilmagan: u shu manzil:port dagi BARCHA saytlar uchun
    # global yoqiladi (boshqa saytlarga ta'sir), Qt klienti esa HTTP/1.1 ishlatadi.
    listen 443 ssl;
    server_name sync.example.uz;

    ssl_certificate     /etc/letsencrypt/live/sync.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/customsync.access.log customsync_noquery;

    # media.max_upload_bytes = 52428800 (50 MiB) bilan MOS bo'lishi shart.
    # Bu yer kichikroq bo'lsa, klient serverning 413 emas, nginx ning 413
    # javobini oladi va xato xabari noto'g'ri bo'ladi.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade -- busiz /ws/notify ishlamaydi.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $customsync_connection_upgrade;

        # /ws/notify ulanishi trafiksiz uzoq turadi. Standart 60s uni
        # jimgina uzib qo'yadi va klient bildirishnomalarni yo'qotadi.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name sync.example.uz;

    access_log /var/log/nginx/customsync.access.log customsync_noquery;

    # Sertifikat webroot orqali olinadi va yangilanadi:
    #   certbot certonly --webroot -w /var/www/letsencrypt -d sync.example.uz
    # Bu location bo'lmasa, 90 kundan keyingi yangilanish yiqiladi.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
